name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms, because the parts that differ between them are exactly
    # the parts most easily got wrong: the in-use check reads /proc on Linux
    # and shells out to lsof on macOS, and only the runner can prove the
    # second one works.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      # The runners between them cover every shell: ubuntu gets zsh and fish
      # from apt, and macOS brings the bash 3.2 the bash integration is
      # actually written against. make vet skips any shell that is missing and
      # says so, rather than failing the way a bare 'zsh -n' did on ubuntu.
      - name: install the shells to check against
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - name: vet, and parse the shell integrations
        run: make vet
      - name: cross-compile the release targets
        run: |
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} go build ./... || exit 1
          done
      # The installer and a profile's whole life, as a user would meet them:
      # install from the release archives with install.sh, then add, rename
      # and rm a profile in fresh zsh and bash shells. On macOS that bash is
      # the system 3.2, started as a login shell the way Terminal starts it.
      - name: end to end
        run: make e2e
